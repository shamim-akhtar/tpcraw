# GitHub switches off scheduled workflows in a public repository after 60 days
# with no update to the repository. This happened from 2 October to 3 November
# 2026, and the daily crawler did not run. This workflow adds one dated line to
# .github/keepalive.txt on the 1st of every month, so the 60 days never pass.
name: Keep schedules running

on:
  schedule:
    - cron: '0 20 1 * *'  # 1st of the month, 8 PM UTC = 4 AM SGT on the 2nd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add a dated line and push
        run: |
          echo "$(date -u +%Y-%m-%d) kept the scheduled workflows running" >> .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "Monthly update to keep the scheduled workflows running"
          git push
